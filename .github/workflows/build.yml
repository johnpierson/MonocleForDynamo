name: Build MonocleForDynamo

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release 2.19
          - Release 3.6
          - Release 3.7
          - Release 4.1
          - Release 4.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup MSBuild for .NET Framework
        uses: microsoft/setup-msbuild@v1.3

      - name: Run local group naming tests
        if: matrix.configuration == 'Release 4.2'
        run: dotnet run --project tests/Monocle.LocalGroupNaming.Tests/Monocle.LocalGroupNaming.Tests.csproj --configuration Release

      - name: Build canonical project
        shell: pwsh
        run: >-
          msbuild src/Monocle/Monocle.sln
          /p:Configuration="${{ matrix.configuration }}"
          /p:Platform="Any CPU"
          /p:EnableDeploymentCopy=false
          /t:Restore,Build

      - name: Run pure regression tests
        if: matrix.configuration == 'Release 4.2'
        run: dotnet run --project tests/Monocle.RegressionTests/Monocle.RegressionTests.csproj --configuration Release
