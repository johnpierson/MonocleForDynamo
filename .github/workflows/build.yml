name: Build MonocleForDynamo

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Shallow is enough; pushing the deploy commit does not need full history.
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run unit tests
        run: |
          $testProjects = Get-ChildItem -Path tests -Filter *.csproj -Recurse -ErrorAction SilentlyContinue
          if (-not $testProjects) {
            Write-Host "No test projects found; skipping."
            exit 0
          }
          foreach ($proj in $testProjects) {
            dotnet test $proj.FullName -c Release --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # Builds every version in versions.json (active list) and drops each DLL into deploy\<version>\.
      - name: Build all active Dynamo versions
        run: .\scripts\build-all.ps1

      - name: Build Monocle loader
        run: |
          dotnet build src/MonocleLoader/MonocleExtension/MonocleExtension.csproj -c Release --nologo

      - name: Verify deploy folder structure
        run: |
          $matrix = Get-Content versions.json -Raw | ConvertFrom-Json
          $allVersions = @($matrix.frozen) + @($matrix.active)
          $missing = @()

          foreach ($version in $allVersions) {
            $dllPath = Join-Path "deploy" $version "MonocleViewExtension.dll"
            if (Test-Path $dllPath) {
              Write-Host "Found $dllPath"
            } else {
              Write-Host "::error::Missing $dllPath"
              $missing += $version
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "::error::Deploy verification failed for: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All $($allVersions.Count) deploy DLLs verified."

      # Dynamo 2.x is frozen. Its DLLs are immutable artifacts that installed copies of the
      # loader download from master, so a change here means something rebuilt them by mistake.
      - name: Guard frozen 2.x artifacts
        run: |
          $changed = git status --porcelain -- deploy/2.*
          if ($changed) {
            Write-Host "::error::Frozen Dynamo 2.x artifacts were modified:"
            Write-Host $changed
            exit 1
          }
          Write-Host "Frozen 2.x artifacts untouched."

      - name: Configure Git
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push deploy folder changes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git add deploy/3.* deploy/4.*
          $changes = git diff --cached --name-only
          if ($changes) {
            git commit -m "chore: update deploy folder with latest builds [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            Write-Host "Pushed deploy updates to ${{ github.ref_name }}"
          } else {
            Write-Host "No changes to commit in deploy folder"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-folder
          path: deploy/
          retention-days: 30

      - name: Upload loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: monocle-loader
          path: src/MonocleLoader/MonocleExtension/bin/Release/**/MonocleExtension.dll
          retention-days: 30
